name: CPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-smoke:
    name: Python ${{ matrix.python-version }} / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run release smoke suite
        run: python scripts/smoke_software.py --full
