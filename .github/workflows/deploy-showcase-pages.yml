name: Deploy SFN research site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sfms-research-showcase/**'
      - '.github/workflows/deploy-showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfms-research-showcase
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sfms-research-showcase/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build static site
        env:
          VITE_HASH_ROUTER: 'true'
        run: npm run build:pages -- --base "${{ steps.pages.outputs.base_path }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: sfms-research-showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
